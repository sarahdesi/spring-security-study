spring.application.name=spring-security-study
#mariadb -u root -p -e "CREATE DATABASE spring_security_study;"
# Banco de dados (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/spring_security_study
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-de-estudo-com-32-caracteres}